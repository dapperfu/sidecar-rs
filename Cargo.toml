[workspace]
members = ["sidecar", "sidecar-cli", "sidecar-py"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["sidecar-rs contributors"]
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
pyo3 = { version = "0.28", features = ["abi3-py310"] }
thiserror = "2.0"
